# Orquestacion de produccion para un servidor Linux de 2 vCPU y 2 GB de RAM
# (la VM de la PUCP o una instancia EC2 de AWS Academy).
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# (en la practica se usa deploy/scripts/desplegar.sh). Lee deploy/.env.
#
# Solo `web` publica puertos (80 y 443). `backend` y `db` quedan en la red
# interna: nadie fuera del servidor puede hablarles directamente.
name: paqrap

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paqrap}
      POSTGRES_USER: ${POSTGRES_USER:-paqrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en deploy/.env}
      TZ: America/Lima
    # Ajustes para 2 GB de RAM compartidos con la JVM.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    logging: *logging

  backend:
    build:
      context: ../backend
    image: paqrap-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-paqrap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paqrap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      TZ: America/Lima
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 900m
    logging: *logging

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    image: paqrap-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados emitidos por Let's Encrypt: si se pierden, se reemitiran,
      # pero Let's Encrypt limita la cantidad de emisiones por dominio.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  # Datos de PostgreSQL. `docker compose down` NO lo borra; `down -v` SI.
  pgdata:
  caddy-data:
  caddy-config:
