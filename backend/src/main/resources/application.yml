server:
  port: 8080
  servlet:
    session:
      # Una sesion inactiva expira a los 30 minutos; la cookie no es legible desde JavaScript.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: paqrap-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/paqrap
    username: paqrap
    password: paqrap
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Parametros propios del dominio PaqRap. Ningun numero magico de negocio
# debe escribirse en el codigo; todo valor configurable se lee desde aqui
# (STD 2.3).
paqrap:
  seguridad:
    login:
      # Limite de intentos fallidos de inicio de sesion (fuerza bruta).
      maximo-intentos-usuario: 5
      maximo-intentos-ip: 20
      ventana-minutos: 15
      bloqueo-minutos: 15
  concurrencia:
    # Corridas del planificador que se resuelven a la vez (0 = una por nucleo);
    # las demas esperan su turno hasta este limite y luego reciben 503.
    ejecuciones-simultaneas: 0
    espera-maxima-segundos: 120
    # Planes recientes que otros navegadores pueden abrir (rubrica G06).
    simulaciones-compartidas: 6
  planificador:
    algoritmo-activo: IACO
    semilla-aleatoria: 20220954
    # I-ACO
    peso-feromona: 1.0
    peso-heuristica-costo: 2.0
    peso-urgencia: 1.5
    tasa-evaporacion: 0.2
    recompensa-global: 100.0
    feromona-inicial: 0.1
    num-iteraciones: 40
    num-hormigas: 15
    # AGA-ES-TW
    tamano-poblacion: 60
    num-generaciones: 120
    tamano-torneo: 3
    porcentaje-elitismo: 0.10
    prob-cruce-base: 0.85
    prob-mutacion-base: 0.15
    penalidad-plazo: 10000.0
    penalidad-capacidad: 5000.0
  flota:
    # Velocidades promedio del enunciado, modificables en ejecucion.
    velocidad-kmh-auto: 40
    velocidad-kmh-moto: 25
    velocidad-kmh-bicicleta: 12
    # Capacidad en paquetes del producto P.
    capacidad-auto: 24
    capacidad-moto: 8
    capacidad-bicicleta: 4
    # Costo total por kilometro recorrido, en soles.
    costo-km-auto: 8.00
    costo-km-moto: 6.00
    costo-km-bicicleta: 3.00
    # Tamano de la flota: configurable antes de iniciar una ejecucion.
    cantidad-autos: 10
    cantidad-motos: 15
    cantidad-bicicletas: 12
  almacen:
    stock-maximo: 1000
    stock-minimo: 0
    umbral-ambar-porcentaje: 0.33
    umbral-rojo-porcentaje: 0.66
    # Ubicaciones vigentes segun la respuesta "CAMBIO" del Q&A del curso:
    # central (27,14), Nor-Oeste (12,38), Este (57,27).
    central-x: 27
    central-y: 14
    noroeste-x: 12
    noroeste-y: 38
    este-x: 57
    este-y: 27

logging:
  level:
    pe.edu.pucp.paqrap: INFO
